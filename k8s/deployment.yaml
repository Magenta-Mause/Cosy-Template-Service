apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosy-template-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cosy-template-service
  template:
    metadata:
      labels:
        app: cosy-template-service
    spec:
      containers:
        - name: cosy-template-service
          image: ghcr.io/magenta-mause/cosy-template-service:v3.0.1
          ports:
            - containerPort: 8080
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cosy-template-service
                  key: cosy-template-service-github-token
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://grafana-k8s-monitoring-alloy-receiver.observability.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: cosy-template-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=cosy,service.instance.id=$(POD_NAME),deployment.environment=production
          livenessProbe:
            httpGet:
              path: /templates
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /templates
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
